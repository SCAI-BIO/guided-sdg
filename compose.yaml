services:
  guided-sdg:
    image: guided-sdg
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SDR_URL: http://sdr:8000
      DATA_DIR: /workspace/data
      OUTPUT_DIR: /workspace/output
    volumes:
      - ./data:/workspace/data:Z
      - ./output:/workspace/output:Z

  sdr:
    build:
      context: .
      dockerfile: Dockerfile.sdr
    environment:
      SDR_WORKDIR: /synthetic_data_release
    volumes:
      - ./data:/workspace/data:Z
      - ./output:/workspace/output:Z
