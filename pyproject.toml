[project]
name = "agentic-synth-data"
version = "0.1.0"
authors = [
    { name = "Annette Lewis", email = "annette.lewis@scai.fraunhofer.de" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain[openai]>=1.2.17",
    "langchain-core>=1.3.3",
    "langgraph>=1.1.10",
    "langgraph-checkpoint>=4.0.3",
    "matplotlib>=3.10.9",
    "pydantic>=2.13.3",
    "pyinputplus>=0.2.12",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "pyarrow>=12,<22",
    "syndat>=0.13.6",
    "matplotlib-inline>=0.2.2",
    "ipykernel>=7.2.0",
    "anonymeter>=1.1.0",
    "ipywidgets>=8.1.8",
    "streamlit>=1.64.0",
    "plotly>=7.1.0",
    "tabulate>=0.10.0",
    "st-styled>=0.5.1",
    "numpy==1.26.4",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
