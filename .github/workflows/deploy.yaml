name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: guided-sdg
            context: .
            file: ./Dockerfile
            cache_from: type=gha,scope=guided-sdg
            cache_to: type=gha,mode=max,scope=guided-sdg
          - image: sdr
            context: ./sdr_service
            file: ./sdr_service/Dockerfile
            # The base image alone is ~10 GB, which would exceed the repo's
            # 10 GB Actions cache budget and evict every other cache entry.
            cache_from: ''
            cache_to: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force
          df -h /

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/scai-bio/agentic-synth-data/${{ matrix.image }}:latest
            ghcr.io/scai-bio/agentic-synth-data/${{ matrix.image }}:${{ steps.version.outputs.version }}
          cache-from: ${{ matrix.cache_from }}
          cache-to: ${{ matrix.cache_to }}
