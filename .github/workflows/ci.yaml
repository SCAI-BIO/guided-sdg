name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Check lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify that uv.lock matches pyproject.toml
        run: uv sync --frozen --dry-run

  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: guided-sdg
            context: .
            file: ./Dockerfile
            cache_from: type=gha,scope=guided-sdg
            cache_to: type=gha,mode=max,scope=guided-sdg
          - image: sdr
            context: ./sdr_service
            file: ./sdr_service/Dockerfile
            # The base image alone is ~10 GB, which would exceed the repo's
            # 10 GB Actions cache budget and evict every other cache entry.
            cache_from: ''
            cache_to: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: ${{ matrix.cache_from }}
          cache-to: ${{ matrix.cache_to }}
